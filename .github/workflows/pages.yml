name: Deploy learning site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Bundle pinned browser C# compiler
        run: |
          mkdir -p dist/playground/vendor/wasmsharp
          npm pack @wasmsharp/core@0.10.2 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/wasmsharp-core-0.10.2.tgz" --strip-components=1 -C dist/playground/vendor/wasmsharp
          test -f dist/playground/vendor/wasmsharp/index.js
          test -f dist/playground/vendor/wasmsharp/initializeWasmSharpModule.js
          node --check dist/playground/browser-runner.js
          node --check dist/playground/lab.js
      - name: Bundle SQLite WebAssembly
        run: |
          mkdir -p dist/playground/vendor/sqljs
          npm pack sql.js@1.13.0 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/sql.js-1.13.0.tgz" --strip-components=2 -C dist/playground/vendor/sqljs package/dist/sql-wasm.js package/dist/sql-wasm.wasm
          test -f dist/playground/vendor/sqljs/sql-wasm.wasm
          node --check dist/playground/web-lab.js
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
